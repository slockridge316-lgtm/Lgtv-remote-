plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lgtvremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.lgtvremote'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}
